name: frontend
description: Cliente Flutter do Duolinfo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  google_sign_in: ^6.2.2
  google_sign_in_web: ^0.12.4
  flutter_dotenv: ^6.0.1
  web: ^1.1.1
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  shadcn_ui: ^0.57.4
  velocity_x: ^4.3.1
  flutter_animate: ^4.5.2
  fl_chart: ^1.3.1
  animations: ^3.0.0
  shimmer: ^4.0.0
  percent_indicator: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

